# src/limo_ros2/limo_bringup/param/limo_slam_toolbox.yaml

slam_toolbox:
  ros__parameters:
    odom_frame:   odom
    map_frame:    map
    base_frame:   base_link
    scan_topic:   /scan

    mode: mapping

    resolution:         0.05
    max_laser_range:    12.0

    minimum_travel_distance: 0.5
    minimum_travel_heading:  0.5
    map_update_interval:     5.0

    use_scan_matching:    true
    use_scan_barycenter:  true

    serialization_filename: /tmp/limo_map
    use_sim_time: false
