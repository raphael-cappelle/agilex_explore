# src/limo_ros2/limo_bringup/params/limo_slam_nav2_params.yaml

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: ""
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    controller_frequency: 10.0
    transform_tolerance: 0.5

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15      # plus permissif pour l'exploration
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Vitesses du LIMO (mode différentiel)
      min_vel_x: 0.0
      max_vel_x:  0.3
      max_vel_y:  0.0              # pas holonome
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_vel_theta: -1.0
      max_vel_theta:  1.0
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.5
      decel_lim_theta: -1.5
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 10
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      Oscillation.scale: 1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0  
  GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true          # IMPORTANT : permet de naviguer vers zones inconnues

recoveries_server:
  ros__parameters:
    use_sim_time: false
    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    back_up:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width:  3
      height: 3
      resolution: 0.05
      # Gabarit du LIMO (~22x28cm)
      robot_radius: 0.18
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan pointcloud_low pointcloud_high
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        pointcloud_low:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          max_obstacle_height: 0.16
          min_obstacle_height: 0.01
          obstacle_max_range: 2.0
          obstacle_min_range: 0.15
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        pointcloud_high:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.22
          max_obstacle_height: 1.5
          obstacle_max_range: 2.0
          obstacle_min_range: 0.15
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true    # IMPORTANT : pour l'exploration
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan pointcloud_low pointcloud_high
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
        pointcloud_low:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.15
          min_obstacle_height: 0.01
          max_obstacle_height: 0.16
        pointcloud_high:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.22
          max_obstacle_height: 1.50
          obstacle_max_range: 2.0
          obstacle_min_range: 0.15
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false
